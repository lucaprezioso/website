<!-- Event snippet for Submit lead form conversion page -->
<script>
  (function () {
    const params = new URLSearchParams(window.location.search);
    const submitted = params.get("submitted") === "1";
    const localTest = params.get("local") === "1";
    const allowedByFormSubmit = sessionStorage.getItem("lo_submit_form_conversion_allowed") === "1";
    const storageKey = "lo_submit_form_conversion_sent";

    if (submitted && !localTest && allowedByFormSubmit && !sessionStorage.getItem(storageKey) && typeof gtag === "function") {
      sessionStorage.setItem(storageKey, "1");
      sessionStorage.removeItem("lo_submit_form_conversion_allowed");

      gtag("event", "conversion", {
        "send_to": "AW-17961819738/x1cDCO69vK0cENq87vRC",
        "value": 1.0,
        "currency": "CHF"
      });
    }

    if (submitted) {
      const lang = params.get("lang") || "en";
      const cleanUrl = window.location.pathname + "?lang=" + encodeURIComponent(lang);
      window.history.replaceState(null, "", cleanUrl);
    }
  })();
</script>

<style>

<script>
  (function () {

        contact: "Per E-Mail kontaktieren",
        homeUrl: "/de/"
      },
      it: {
        title: "Grazie per la richiesta",
        text: "Abbiamo ricevuto la sua richiesta e la ricontatteremo il prima possibile con disponibilità e dettagli.",
        home: "Torna a Luxury Obsession",
        contact: "Contattaci via email",
        homeUrl: "/it/"
      }
    };

    const params = new URLSearchParams(window.location.search);
    const lang = params.get("lang") || "en";
    const t = copy[lang] || copy.en;

    document.documentElement.lang = lang;
    document.title = t.title + " | Luxury Obsession";
    document.getElementById("submittedTitle").textContent = t.title;
    document.getElementById("submittedText").textContent = t.text;
    document.getElementById("backHome").textContent = t.home;
    document.getElementById("backHome").href = t.homeUrl;
    document.getElementById("contactLink").textContent = t.contact;
  })();
</script>
