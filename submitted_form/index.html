<!-- Event snippet for Submit lead form conversion page -->
<script>
  (function () {
    const params = new URLSearchParams(window.location.search);
    const submitted = params.get("submitted") === "1";
    const localTest = params.get("local") === "1";
    const storageFallback = params.get("conversion_fallback") === "1";
    const storageKey = "lo_submit_form_conversion_sent";
    const conversionPageLocation = window.location.href;
    let allowedByFormSubmit = false;
    let conversionAlreadySent = false;

    try {
      allowedByFormSubmit = sessionStorage.getItem("lo_submit_form_conversion_allowed") === "1";
      conversionAlreadySent = sessionStorage.getItem(storageKey) === "1";
    } catch (storageError) {
      // The explicit fallback parameter is added only after a successful form submission.
    }

    if (submitted && !localTest && (allowedByFormSubmit || storageFallback) && !conversionAlreadySent) {
      try {
        sessionStorage.setItem(storageKey, "1");
        sessionStorage.removeItem("lo_submit_form_conversion_allowed");
      } catch (storageError) {
        // The URL is cleaned below, which prevents a normal reload from repeating the conversion.
      }

      window.__LO_FORCE_GOOGLE_TAG__ = true;
      window.__LO_PENDING_GOOGLE_CONVERSION__ = {
        "send_to": "AW-17961819738/x1cDCO69vK0cENq87vRC",
        "value": 1.0,
        "currency": "CHF",
        "page_location": conversionPageLocation
      };
    }

    if (submitted) {
      params.delete("submitted");
      params.delete("local");
      params.delete("conversion_fallback");
      const remainingQuery = params.toString();
      const cleanUrl = window.location.pathname + (remainingQuery ? "?" + remainingQuery : "");
      window.history.replaceState(null, "", cleanUrl);
    }
  })();
</script>

<style>

  .submittedTitle{

<script>
  (function () {
    const copy = {
      en: {
        title: "Thank you for your enquiry",
        text: "We have received your request and will come back to you as soon as possible with availability and details.",
        home: "Back to Luxury Obsession",
        contact: "Contact us by email",
        homeUrl: "/en/"
      },
      de: {
        title: "Vielen Dank für Ihre Anfrage",
        text: "Wir haben Ihre Anfrage erhalten und melden uns so bald wie möglich mit Verfügbarkeit und weiteren Details.",
        home: "Zurück zu Luxury Obsession",
        contact: "Per E-Mail kontaktieren",
        homeUrl: "/"
      },
      it: {
        title: "Grazie per la richiesta",
        text: "Abbiamo ricevuto la sua richiesta e la ricontatteremo il prima possibile con disponibilità e dettagli.",
        home: "Torna a Luxury Obsession",
        contact: "Contattaci via email",
        homeUrl: "/it/"
      }
    };

    const params = new URLSearchParams(window.location.search);
    const lang = params.get("lang") || "en";
    const t = copy[lang] || copy.en;

    document.documentElement.lang = lang;
    document.title = t.title + " | Luxury Obsession";
    document.getElementById("submittedTitle").textContent = t.title;
    document.getElementById("submittedText").textContent = t.text;
    document.getElementById("backHome").textContent = t.home;
    document.getElementById("backHome").href = t.homeUrl;
    document.getElementById("contactLink").textContent = t.contact;
  })();
</script>
