const STATE = { q:"", cat:"" };

function getCatLabel(a, lang){
  return (a.category && (a.category[lang] || a.category.en)) || "";
}

function matchesArticle(a, lang, q, cat){
  const c = getCatLabel(a, lang);
  if(cat && c !== cat) return false;
  if(!q) return true;

  const title = (a.title && (a.title[lang] || a.title.en)) || "";
  const excerpt = (a.excerpt && (a.excerpt[lang] || a.excerpt.en)) || "";
  const hay = (title + " " + excerpt + " " + c).toLowerCase();

  return hay.indexOf(q) !== -1;
}

}

    ARTICLES.forEach(a => {
      const c = getCatLabel(a, lang);
      if(c && !seen.has(c)){
        seen.add(c);
        cats.push(c);
      }
    });

    catSel.innerHTML = "";
    const optAll = document.createElement("option");
    optAll.value = "";
    optAll.textContent = t.filterAll || "";
    catSel.appendChild(optAll);

    cats.forEach(c => {
      const opt = document.createElement("option");
      opt.value = c;
      opt.textContent = c;
      catSel.appendChild(opt);
    });

    catSel.value = STATE.cat || "";
    catSel.setAttribute("aria-label", t.filterLabel || "");
    catSel.addEventListener("change", () => {
      STATE.cat = catSel.value || "";
      renderArticles(lang);
    });
  }

  const lblSearch = document.getElementById("blogSearchLabel");
  if(lblSearch) lblSearch.textContent = t.searchLabel || "";

  const lblFilter = document.getElementById("blogFilterLabel");
  if(lblFilter) lblFilter.textContent = t.filterLabel || "";
}

function fmtDate(iso, lang){
  try{
    const d = new Date(iso + "T00:00:00");
    const locale = ({en:"en-GB",de:"de-CH",it:"it-CH"})[lang] || "en-GB";
    return d.toLocaleDateString(locale, { year:"numeric", month:"short", day:"2-digit" });
  }catch(e){
    return iso;
  }
}

function renderArticles(lang){
  const grid = document.getElementById("blogGrid");
  grid.innerHTML = "";
  const t = I18N[lang] || I18N.en;
  const isMobile = window.matchMedia && window.matchMedia("(max-width: 760px)").matches;

  const q = (STATE.q || "").trim().toLowerCase();
  const catFilter = STATE.cat || "";
  const filtered = ARTICLES.filter(a => matchesArticle(a, lang, q, catFilter));
  setResults(filtered.length, ARTICLES.length, lang);

  if(!filtered.length){
    grid.innerHTML = `<div class="card" style="padding:1.2rem;opacity:0.86">${t.empty || ""}</div>`;
    return;
  }

  filtered.forEach(a => {
    const card = document.createElement("a");
    card.href = window.__LO__.buildUrl(a.slug, lang, "top");

    const title = (a.title && (a.title[lang] || a.title.en)) || "";
    const excerpt = (a.excerpt && (a.excerpt[lang] || a.excerpt.en)) || "";
    const cat = (a.category && (a.category[lang] || a.category.en)) || "";
    const read = (a.read && (a.read[lang] || a.read.en)) || "";
    const date = fmtDate(a.date, lang);

    card.setAttribute("aria-label", title || "Article");

    if(isMobile){
      card.className = "card blogCardM";
      card.innerHTML = `
        <div class="blogThumbWrapM">
          <img src="${a.image}" alt="${title.replace(/"/g, "&quot;")}" loading="lazy" decoding="async">
        </div>
        <div class="blogTopM">
          <div class="blogMetaM">
            <span class="blogPill">${cat}</span>
            <span class="metaSepM">·</span>
            <span>${date}</span>
            <span class="metaSepM">·</span>
            <span>${read}</span>
          </div>
          <h3 class="blogTitleM">${title}</h3>
        </div>
        <div class="blogBottomM">
          <p class="blogExcerptM">${excerpt}</p>
          <div class="blogReadM">${t.readLabel} <span aria-hidden="true">→</span></div>
        </div>
      `;
    }else{
      card.className = "card blogCard";
      card.innerHTML = `
        <img class="blogThumb" src="${a.image}" alt="${title.replace(/"/g, "&quot;")}" loading="lazy" decoding="async">
        <div class="blogCardInner">
          <div>
            <div class="blogMeta">
              <span class="blogPill">${cat}</span>
              <span>·</span>
              <span>${date}</span>
              <span>·</span>
              <span>${read}</span>
            </div>
            <h3 class="blogTitle">${title}</h3>
            <p class="blogExcerpt">${excerpt}</p>
          </div>
          <div class="blogRead">${t.readLabel} <span>→</span></div>
        </div>
      `;
    }

    grid.appendChild(card);

  });
  if(isMobile) tuneMobileCards();
}

function tuneMobileCards(){
  const cards = document.querySelectorAll("a.blogCardM");
  if(!cards.length) return;

  window.requestAnimationFrame(() => {
    cards.forEach(card => {
      const titleEl = card.querySelector(".blogTitleM");
      const exEl = card.querySelector(".blogExcerptM");
      if(!titleEl || !exEl) return;

      // default excerpt lines on mobile
      exEl.style.display = "";
      exEl.style.setProperty("-webkit-line-clamp", "3");

      const cs = window.getComputedStyle(titleEl);
      const lh = parseFloat(cs.lineHeight) || 18;
      const lines = Math.round(titleEl.getBoundingClientRect().height / lh);

      // If title needs more space, let it borrow from the summary
      if(lines >= 4){
        exEl.style.display = "none";
      }else if(lines >= 3){
        exEl.style.setProperty("-webkit-line-clamp", "2");
      }
    });
  });
}

  setMobileText("mContact", t.navContact);
  setMobileText("mImpressum", t.impressum);
  setText("mRequest", t.navRequest);

  setHref("mBlog", window.__LO__.buildUrl("blog.html", lang, "top"));
  setHref("mContact", window.__LO__.buildUrl("../index.html", lang, "contact"));
  setHref("mImpressum", window.__LO__.buildUrl("../impressum.html", lang, "top"));

  document.getElementById("eyebrow").textContent = t.eyebrow;

  document.getElementById("footerImpressum").textContent = t.impressum;
  document.getElementById("footerImpressum").href = window.__LO__.buildUrl("../impressum.html", lang, "top");

  initControls(lang);

  renderArticles(lang);

  const mql = window.matchMedia ? window.matchMedia("(max-width: 760px)") : null;
  if(mql){
    const rerender = () => renderArticles(lang);
    if(mql.addEventListener) mql.addEventListener("change", rerender);
    else if(mql.addListener) mql.addListener(rerender);
  }

  document.getElementById("year").textContent = String(new Date().getFullYear());
}

document.addEventListener("DOMContentLoaded", init);
  </script>
